# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Koncept62/lara-san-cristobal
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/fb4ebccd-500a-4fc1-b7a9-27c64ae1b621/pkce
  auth_token_endpoint: /sites/fb4ebccd-500a-4fc1-b7a9-27c64ae1b621/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://larasancristobal.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ---------------------------------------------------------
  # PROPERTY FOR SALE
  # ---------------------------------------------------------
  - name: "property-for-sale"
    label: "Properties for Sale"
    folder: "src/content/property-for-sale"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Property Name", name: "propertyName", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "In Brief", name: "inBrief", widget: "text" }
      - { label: "Property Size", name: "propertySize", widget: "string" }
      - { label: "Plot Size", name: "plotSize", widget: "string" }
      - { label: "Bedrooms", name: "bedrooms", widget: "number" }
      - { label: "Bathrooms", name: "bathrooms", widget: "number" }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Price (MXN)", name: "priceMxn", widget: "string", required: false }
      - { label: "Price (USD)", name: "priceUsd", widget: "string", required: false }
      - { label: "Reference Code", name: "referenceCode", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold"]
        default: "Available"
      - label: "Main Image"
        name: "mainImage"
        widget: "image"
        hint: "Used as the thumbnail on property cards and listing previews"
      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
      - label: "Floor Plan"
        name: "floorPlan"
        widget: "image"
        required: false

  # ---------------------------------------------------------
  # PROPERTY FOR RENT
  # ---------------------------------------------------------
  - name: "property-for-rent"
    label: "Properties for Rent"
    folder: "src/content/property-for-rent"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Property Name", name: "propertyName", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "In Brief", name: "inBrief", widget: "text" }
      - { label: "Property Size", name: "propertySize", widget: "string" }
      - { label: "Bedrooms", name: "bedrooms", widget: "number" }
      - { label: "Bathrooms", name: "bathrooms", widget: "number" }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Price (MXN)", name: "priceMxn", widget: "string", required: false }
      - { label: "Price (USD)", name: "priceUsd", widget: "string", required: false }
      - { label: "Reference Code", name: "referenceCode", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold"]
        default: "Available"
      - label: "Main Image"
        name: "mainImage"
        widget: "image"
        hint: "Used as the thumbnail on property cards and listing previews"
      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
      - label: "Floor Plan"
        name: "floorPlan"
        widget: "image"
        required: false

  # ---------------------------------------------------------
  # LAND
  # ---------------------------------------------------------
  - name: "land"
    label: "Land"
    folder: "src/content/land"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Property Name", name: "propertyName", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "In Brief", name: "inBrief", widget: "text" }
      - { label: "Land Size", name: "landSize", widget: "string" }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Price (MXN)", name: "priceMxn", widget: "string", required: false }
      - { label: "Price (USD)", name: "priceUsd", widget: "string", required: false }
      - { label: "Reference Code", name: "referenceCode", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold"]
        default: "Available"
      - label: "Main Image"
        name: "mainImage"
        widget: "image"
        hint: "Used as the thumbnail on land listings and previews"
      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
      # No floorPlan field for land listings

  # ---------------------------------------------------------
  # NOTES (blog)
  # ---------------------------------------------------------
  - name: "notes"
    label: "Notes"
    folder: "src/content/notes"
    create: true
    slug: "{{pubDate}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        hint: "Posts with a future date are hidden from visitors until that date/time — no rebuild needed."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Buying in Mexico", "Restoring", "Off grid", "The town", "Interiors", "From Lara"]
      - { label: "Short blurb", name: "blurb", widget: "text", hint: "One or two sentences shown on the listing card." }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown" }
