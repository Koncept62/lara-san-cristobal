# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Koncept62/lara-san-cristobal
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/fb4ebccd-500a-4fc1-b7a9-27c64ae1b621/pkce
  auth_token_endpoint: /sites/fb4ebccd-500a-4fc1-b7a9-27c64ae1b621/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://astro-lsc.netlify.app

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# ---------------------------------------------------------
# I18N — notes, property-for-sale, property-for-rent, land
# ---------------------------------------------------------
# structure_multiple_files persists one file per locale per entry, e.g.
# src/content/notes/<slug>.en.md and src/content/notes/<slug>.es.md.
# Collections without their own `i18n:` key are unaffected — this only
# activates per collection that opts in below with `i18n: true`.
i18n:
  structure: multiple_files
  locales: [en, es]
  default_locale: en

# ---------------------------------------------------------
# MEDIA LIBRARY — Cloudinary
# ---------------------------------------------------------
# Every `widget: image` field (property mainImage / gallery / floorPlan and
# notes coverImage) now opens the Cloudinary browse-and-upload picker instead
# of a plain URL text field. Nothing per-field changes — Decap routes all
# image widgets through the configured media library automatically.
#
# Only PUBLIC credentials live here: cloud name, the public API key, and an
# UNSIGNED upload preset. The Cloudinary API secret must never appear in this
# file or anywhere else in the published site — the unsigned preset is what
# lets the browser upload without it.
#
# Image values already saved in content files are plain URL strings (local
# paths like /images/foo.jpg and existing res.cloudinary.com URLs alike); the
# picker writes the same kind of string, so saved content keeps working
# unchanged. media_folder / public_folder above stay as the fallback store.
media_library:
  name: cloudinary
  config:
    cloud_name: x8jfmflw
    api_key: "625879793864123"
    upload_preset: lara-uploads

collections:
  # ---------------------------------------------------------
  # PROPERTY FOR SALE
  # ---------------------------------------------------------
  - name: "property-for-sale"
    label: "Properties for Sale"
    folder: "src/content/property-for-sale"
    create: true
    slug: "{{slug}}"
    identifier_field: propertyName
    i18n: true
    fields:
      - { label: "Property Name", name: "propertyName", widget: "string", i18n: true }
      - { label: "Location", name: "location", widget: "string", i18n: true }
      - { label: "In Brief", name: "inBrief", widget: "text", i18n: true }
      - { label: "Property Size", name: "propertySize", widget: "string", i18n: false }
      - { label: "Plot Size", name: "plotSize", widget: "string", i18n: false }
      - { label: "Bedrooms", name: "bedrooms", widget: "number", i18n: false }
      - { label: "Bathrooms", name: "bathrooms", widget: "number", i18n: false }
      - { label: "Description", name: "description", widget: "markdown", i18n: true }
      - { label: "Price (MXN)", name: "priceMxn", widget: "string", required: false, i18n: false }
      - { label: "Price (USD)", name: "priceUsd", widget: "string", required: false, i18n: false }
      - { label: "Reference Code", name: "referenceCode", widget: "string", i18n: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold"]
        default: "Available"
        i18n: false
      - label: "Main Image"
        name: "mainImage"
        widget: "image"
        hint: "Used as the thumbnail on property cards and listing previews"
        i18n: false
      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
        i18n: false
      - label: "Floor Plan"
        name: "floorPlan"
        widget: "image"
        required: false
        i18n: false
      - label: "Featured on Homepage"
        name: "featuredHomepage"
        widget: "boolean"
        default: false
        hint: "Shows this property in the grid on the homepage. Up to 3 show at once — if more are flagged, the 3 most recently added win; if fewer, the newest listings fill the rest."
        i18n: false
      - label: "Date Added"
        name: "dateAdded"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        required: false
        hint: "Set when the property is created. Controls the order listings fill the homepage grid — newest first."
        i18n: false

  # ---------------------------------------------------------
  # PROPERTY FOR RENT
  # ---------------------------------------------------------
  - name: "property-for-rent"
    label: "Properties for Rent"
    folder: "src/content/property-for-rent"
    create: true
    slug: "{{slug}}"
    identifier_field: propertyName
    i18n: true
    fields:
      - { label: "Property Name", name: "propertyName", widget: "string", i18n: true }
      - { label: "Location", name: "location", widget: "string", i18n: true }
      - { label: "In Brief", name: "inBrief", widget: "text", i18n: true }
      - { label: "Property Size", name: "propertySize", widget: "string", i18n: false }
      - { label: "Bedrooms", name: "bedrooms", widget: "number", i18n: false }
      - { label: "Bathrooms", name: "bathrooms", widget: "number", i18n: false }
      - { label: "Description", name: "description", widget: "markdown", i18n: true }
      - { label: "Price (MXN)", name: "priceMxn", widget: "string", required: false, i18n: false }
      - { label: "Price (USD)", name: "priceUsd", widget: "string", required: false, i18n: false }
      - { label: "Reference Code", name: "referenceCode", widget: "string", i18n: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold"]
        default: "Available"
        i18n: false
      - label: "Main Image"
        name: "mainImage"
        widget: "image"
        hint: "Used as the thumbnail on property cards and listing previews"
        i18n: false
      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
        i18n: false
      - label: "Floor Plan"
        name: "floorPlan"
        widget: "image"
        required: false
        i18n: false

  # ---------------------------------------------------------
  # LAND
  # ---------------------------------------------------------
  - name: "land"
    label: "Land"
    folder: "src/content/land"
    create: true
    slug: "{{slug}}"
    identifier_field: propertyName
    i18n: true
    fields:
      - { label: "Property Name", name: "propertyName", widget: "string", i18n: true }
      - { label: "Location", name: "location", widget: "string", i18n: true }
      - { label: "In Brief", name: "inBrief", widget: "text", i18n: true }
      - { label: "Land Size", name: "landSize", widget: "string", i18n: false }
      - { label: "Description", name: "description", widget: "markdown", i18n: true }
      - { label: "Price (MXN)", name: "priceMxn", widget: "string", required: false, i18n: false }
      - { label: "Price (USD)", name: "priceUsd", widget: "string", required: false, i18n: false }
      - { label: "Reference Code", name: "referenceCode", widget: "string", i18n: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold"]
        default: "Available"
        i18n: false
      - label: "Main Image"
        name: "mainImage"
        widget: "image"
        hint: "Used as the thumbnail on land listings and previews"
        i18n: false
      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
        i18n: false
      # No floorPlan field for land listings

  # ---------------------------------------------------------
  # NOTES (blog)
  # ---------------------------------------------------------
  - name: "notes"
    label: "Notes"
    folder: "src/content/notes"
    create: true
    slug: "{{pubDate}}-{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        i18n: false
        hint: "Posts with a future date are hidden from visitors until that date/time — no rebuild needed. Set once — shared across languages."
      - label: "Featured on Homepage"
        name: "featuredHomepage"
        widget: "boolean"
        default: false
        i18n: false
        hint: "Shows this note in the 'Notes from the office' strip on the homepage. Turn on for one note at a time — the newest flagged note wins if more than one is on. Shared across languages."
      - label: "Featured on Notes Page"
        name: "featuredNotesHero"
        widget: "boolean"
        default: false
        i18n: false
        hint: "Shows this note in the hero band above the grid on the /notes page. Independent of the homepage flag; newest flagged note wins if more than one is on. Shared across languages."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Buying in Mexico", "Restoring", "Off grid", "The town", "Interiors"]
        i18n: false
        hint: "Shared across languages."
      - { label: "Short blurb", name: "blurb", widget: "text", i18n: true, hint: "One or two sentences shown on the listing card." }
      - { label: "Cover Image", name: "coverImage", widget: "image", i18n: false, hint: "Shared across languages." }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
